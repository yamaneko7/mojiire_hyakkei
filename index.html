<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>文字入れ百景</title>
<style>
  :root{
    --bg:#111315; --paper:#1a1d20; --ink:#f2f4f5; --line:#4a5056;
    --head:#ffffff; --accent:#d9dde0; --soft:#262a2e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  .wrap{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--paper);padding-bottom:28px}
  header{
    padding:15px 16px 11px;border-bottom:1px solid var(--line);
    background:linear-gradient(#24282c,#171a1d);
  }
  header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.08em;color:var(--head)}
  .site-logo{
    display:block;
    width:min(72vw,320px);
    height:auto;
    margin:0 0 4px 0;
  }
  header p{font-size:11px;margin:4px 0 0;color:#c2c7cb}

  .photo-area{padding:14px 14px 8px}
  .preview-shell{
    background:#0d0f11;border:1px solid #555b61;padding:5px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  canvas{width:100%;height:auto;display:block;background:#ddd;min-height:220px}
  .empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#d0d4d7;font-size:14px;pointer-events:none;
  }
  .canvas-wrap{position:relative}
  .section{padding:9px 14px}
  .label{font-size:12px;color:#d3d7da;margin-bottom:5px;font-weight:600}
  textarea{
    width:100%;height:72px;resize:none;border:1px solid #fff;border-radius:3px;
    background:#0f1113;padding:9px;font:16px/1.45 inherit;color:#fff;outline:none;
  }
  textarea:focus{border-color:#aeb4b9}
  .row{display:flex;gap:8px;align-items:center}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .four{grid-template-columns:1fr 1fr 1fr 1fr}
  button,.file-label{
    border:1px solid #bcb3a6;background:linear-gradient(#33383d,#25292d);
    color:#f0f2f3;border-radius:3px;padding:10px 8px;font-size:13px;text-align:center;
    font-family:inherit;cursor:pointer;
  }
  button.on{background:linear-gradient(#e4e7e9,#bfc5c9);color:#111;border-color:#e8ecef}
  input[type=file]{display:none}
  input[type=range]{width:100%;accent-color:#d9dde0}
  .size-row{display:grid;grid-template-columns:1fr 50px;gap:10px;align-items:center}
  .size-val{text-align:right;font-size:13px;color:#e0e3e5}
  .file-label{display:block;width:100%;font-weight:600;padding:12px}
  .save{
    width:100%;background:linear-gradient(#f0f2f3,#c9ced2);color:#111;border-color:#f5f7f8;
    font-weight:600;font-size:15px;padding:13px;margin-top:4px
  }
  .note{font-size:10px;color:#b8bec3;text-align:center;margin-top:7px}
  hr{border:0;border-top:1px dotted #4d5359;margin:4px 14px}
  #resultOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:20;
    padding:20px;overflow:auto;text-align:center
  }
  #resultOverlay.show{display:block}
  #resultOverlay img{max-width:100%;max-height:72vh;background:#fff;box-shadow:0 2px 14px #000}
  #resultOverlay p{color:#f3f4f5;font-size:13px}
  #resultOverlay button{min-width:120px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="site-logo" src="IMG_7468.png" alt="文字入れ百景">
    <p>あの頃を、再び。</p>
  </header>

  <div class="photo-area">
    <label class="file-label" for="photoInput">写真を選ぶ</label>
    <input id="photoInput" type="file" accept="image/*">
  </div>

  <div class="photo-area" style="padding-top:2px">
    <div class="preview-shell">
      <div class="canvas-wrap">
        <canvas id="canvas" width="1000" height="750"></canvas>
        <div class="empty" id="empty">ここに写真が表示されます</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="label">ひとこと</div>
    <textarea id="text" maxlength="100" placeholder="文字を入力"></textarea>
  </div>

  <hr>

  <div class="section">
    <div class="label">文字の向き</div>
    <div class="choices">
      <button class="dir on" data-dir="horizontal">横書き</button>
      <button class="dir" data-dir="vertical">縦書き</button>
    </div>
  </div>

  <div class="section">
    <div class="label">文字の位置</div>
    <div class="choices four">
      <button class="pos on" data-pos="tl">左上</button>
      <button class="pos" data-pos="tr">右上</button>
      <button class="pos" data-pos="bl">左下</button>
      <button class="pos" data-pos="br">右下</button>
    </div>
  </div>

  <div class="section">
    <div class="label">文字の大きさ</div>
    <div class="size-row">
      <input id="fontSize" type="range" min="22" max="90" value="46">
      <div class="size-val"><span id="fontSizeVal">46</span> px</div>
    </div>
  </div>

  <div class="section">
    <button class="save" id="saveBtn">画像にして保存</button>
    <div class="note">白文字＋ごく細い黒ふち。文字色や自由配置などはありません。</div>
  </div>
  <div class="note" style="margin-top:18px;padding:0 14px;">
    フォントは『ふい字』を使用しています
  </div>
</div>

<div id="resultOverlay">
  <p>画像を長押しして「写真に保存」してください</p>
  <img id="resultImg" alt="完成画像">
  <br><button id="closeBtn">戻る</button>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const empty=document.getElementById('empty');
const textEl=document.getElementById('text');
const fontSize=document.getElementById('fontSize');
const fontSizeVal=document.getElementById('fontSizeVal');
let img=null, direction='horizontal', position='tl';

// 同じフォルダに置いた「ふい字」を読み込む
const fontFace = new FontFace('Fuiji', 'url(HuiFont29.ttf)');
fontFace.load().then(f=>{
  document.fonts.add(f);
  render();
}).catch(err=>{
  console.warn('ふい字を読み込めませんでした。代替フォントを使用します。', err);
});
const FONT = '"Fuiji","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

function placeholder(){
  ctx.fillStyle='#dedad3';ctx.fillRect(0,0,canvas.width,canvas.height);
}
placeholder();

document.getElementById('photoInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  const im=new Image();
  im.onload=()=>{
    img=im;
    canvas.width=im.naturalWidth; canvas.height=im.naturalHeight;
    empty.style.display='none'; render();
    URL.revokeObjectURL(im.src);
  };
  im.src=URL.createObjectURL(file);
});

function render(){
  if(!img){placeholder();return}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  const txt=textEl.value; if(!txt)return;

  // スライダー値は1000px幅を基準にし、元画像解像度に比例させる
  const fs=+fontSize.value*(canvas.width/1000);
  const margin=Math.max(18,fs*.45);
  ctx.font=`${fs}px ${FONT}`;
  ctx.textBaseline='top';
  ctx.lineJoin='round';
  ctx.strokeStyle='rgba(0,0,0,.95)';
  ctx.fillStyle='#fff';
  ctx.lineWidth=Math.max(1.2,fs*.045); // 読める程度の、ごく細い縁取り

  if(direction==='horizontal') drawHorizontal(txt,fs,margin);
  else drawVertical(txt,fs,margin);
}

function drawGlyph(s,x,y){
  ctx.strokeText(s,x,y);
  ctx.fillText(s,x,y);
}

function drawHorizontal(txt,fs,m){
  const lines=txt.split('\n');
  const lh=fs*1.18;
  const widths=lines.map(s=>ctx.measureText(s).width);
  const totalH=lines.length*lh;
  let y=position[0]==='b' ? canvas.height-m-totalH : m;
  lines.forEach((line,i)=>{
    let x=position[1]==='r' ? canvas.width-m-widths[i] : m;
    drawGlyph(line,x,y+i*lh);
  });
}

function drawVertical(txt,fs,m){
  const cols=txt.split('\n');
  const step=fs*1.12;
  const colW=fs*1.15;
  const heights=cols.map(s=>Array.from(s).length*step);
  const totalW=cols.length*colW;
  let startX=position[1]==='r' ? canvas.width-m-fs : m+(cols.length-1)*colW;
  cols.forEach((col,ci)=>{
    const chars=Array.from(col);
    let y=position[0]==='b' ? canvas.height-m-heights[ci] : m;
    // 縦書きは右から左へ列を送る
    const x=position[1]==='r' ? startX-ci*colW : startX-ci*colW;
    chars.forEach((ch,i)=>drawGlyph(ch,x,y+i*step));
  });
}

textEl.addEventListener('input',render);
fontSize.addEventListener('input',()=>{fontSizeVal.textContent=fontSize.value;render()});

document.querySelectorAll('.dir').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.dir').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); direction=b.dataset.dir; render();
}));
document.querySelectorAll('.pos').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.pos').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const map={tl:'tl',tr:'tr',bl:'bl',br:'br'};
  position=map[b.dataset.pos]; render();
}));

document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!img){alert('先に写真を選んでください');return}
  render();
  document.getElementById('resultImg').src=canvas.toDataURL('image/jpeg',.95);
  document.getElementById('resultOverlay').classList.add('show');
});
document.getElementById('closeBtn').addEventListener('click',()=>{
  document.getElementById('resultOverlay').classList.remove('show');
});
</script>
</body>
</html>
